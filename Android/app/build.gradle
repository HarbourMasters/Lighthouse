plugins {
    id 'com.android.application'
}

// Keep extractor manifests authoritative in the repository root. This is
// intentionally generated for every APK build rather than copied into Android/
// so decomp/YAML updates cannot go stale in a second tracked asset tree.
def generatedRootAssetsDir = file("$buildDir/generated/root-assets")

tasks.register('syncRootAssets', Sync) {
    from('../../assets')
    into("$generatedRootAssetsDir/assets")
}

tasks.register('syncRootConfig', Copy) {
    from('../..') {
        include 'config.yml'
    }
    into(generatedRootAssetsDir)
}

android {
    namespace 'com.pacoa.lighthouse'
    compileSdk 35
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.pacoa.lighthouse'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0-dev'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DUSE_OPENGLES=ON', '-DUSE_NETWORKING=OFF', '-DHAVE_LD_VERSION_SCRIPT=OFF'
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.31.5'
        }
    }

    sourceSets {
        main.assets.srcDir(generatedRootAssetsDir)
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('syncRootAssets'))
    dependsOn(tasks.named('syncRootConfig'))
}
