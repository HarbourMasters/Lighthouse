plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pacoa.lighthouse'
    compileSdk 35
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.pacoa.lighthouse'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0-dev'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DUSE_OPENGLES=ON', '-DUSE_NETWORKING=OFF', '-DHAVE_LD_VERSION_SCRIPT=OFF'
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }
}
